# Alembic configuration for CSIP.
# Migrations target the application-owned schema. Agno runtime tables are
# created/managed by AgentOS itself and MUST NOT be mutated by these
# migrations (project_structure.md section 6).
[alembic]
script_location = db
prepend_sys_path = src
version_path_separator = os
# URL comes from CSIP_DATABASE_URL at runtime (db/env.py); never hardcode secrets.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
